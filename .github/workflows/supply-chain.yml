name: supply-chain
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: npm audit (pinned kit tools)
        working-directory: engine/deps
        run: npm audit --audit-level=high --package-lock-only
      - name: SBOM (CycloneDX)
        if: always()
        working-directory: engine/deps
        # the cache manifest has no version of its own; give the CI copy one so npm can name the root component
        run: npm pkg set version=0.0.0 && npm sbom --sbom-format cyclonedx --package-lock-only > ../../sbom.cdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
