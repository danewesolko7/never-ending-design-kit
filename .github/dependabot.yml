# Dependency updates. A version change to the kit's pinned tools still needs the self-test passing and a dated
# MANIFEST line before merge (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /engine/deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
